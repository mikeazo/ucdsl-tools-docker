name: Docker Build and Push

on:
  push:
    branches:
      - main
    paths:
      - ucdsl.Dockerfile
      - ucdsl-gui.Dockerfile
      - emacs
      - .github/workflows/docker-build-and-push.yml
  workflow_dispatch:

concurrency:
  group: docker-build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-cli-amd64:
    name: Build and push ucdsl (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ucdsl.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}-amd64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:buildcache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:buildcache-amd64,mode=max

  build-and-push-cli-arm64:
    name: Build and push ucdsl (arm64)
    # This public repository can use GitHub's native ARM runner.  Do not
    # replace this with QEMU emulation on an x86 runner: compilation is much
    # slower there.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ucdsl.Dockerfile
          platforms: linux/arm64
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}-arm64
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:buildcache-arm64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:buildcache-arm64,mode=max

  publish-cli-manifest:
    name: Publish ucdsl multi-architecture manifest
    runs-on: ubuntu-latest
    needs:
      - build-and-push-cli-amd64
      - build-and-push-cli-arm64
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish multi-architecture tags
        run: |
          docker buildx imagetools create \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:latest" \
            --tag "${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}" \
            "${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}-amd64" \
            "${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}-arm64"

  build-and-push-gui:
    name: Build and push ucdsl-gui (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ucdsl-gui.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:sha-${{ github.sha }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:buildcache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:buildcache-amd64,mode=max
