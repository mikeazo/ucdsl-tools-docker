name: Docker Build and Push

on:
  push:

concurrency:
  group: docker-build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shell-validation:
    name: Shell Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shell tooling
        run: sudo apt-get update && sudo apt-get install -y bats shellcheck
      - name: Lint shell scripts
        run: shellcheck launch.sh lib/launch_lib.sh
      - name: Run launch-script tests
        run: bats test/launch.bats

  build-and-push-cli:
    name: Build and push ucdsl (arm64 + amd64)
    runs-on: ubuntu-latest
    needs: shell-validation
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set safe directory
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64, amd64

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ucdsl.Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-and-push-gui:
    name: Build and push ucdsl-gui (amd64)
    runs-on: ubuntu-latest
    needs: shell-validation
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set safe directory
        run: git config --global --add safe.directory ${{ github.workspace }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ucdsl-gui.Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/ucdsl-tools-gui:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
